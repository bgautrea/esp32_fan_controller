; Common settings shared by all build environments.
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
build_flags =
    -DCORE_DEBUG_LEVEL=0

; --- Flash over USB ---
;   .venv/Scripts/python.exe -m platformio run -e esp32dev -t upload
; The fan board's USB-serial port may differ from the clock's (COM7). If the
; auto-detect below picks the wrong adapter, pin it explicitly, e.g.:
;   upload_port = COM8
;   monitor_port = COM8
[env:esp32dev]
upload_protocol = esptool

; --- Flash over WiFi (no USB) -----------------------------------------
; OTA is HTTP-push, not a PlatformIO upload protocol. Build, then POST the
; .bin to the device (outbound, so no PC-firewall issues). From a browser:
; use the "Firmware update" box in the web UI. From the CLI:
;   .venv/Scripts/python.exe -m platformio run -e esp32dev            # build only
;   curl.exe -u admin:fancontrol123 -F "firmware=@.pio/build/esp32dev/firmware.bin" \
;            http://fan.local/update
; (user "admin", password = OTA_PASSWORD in include/secrets.h)
